[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-a-dirty-da"
version = "0.1.0"
description = "Verifiable dirty-table task generation foundation for Project A"
requires-python = ">=3.10"
# Canonical fingerprints intentionally cover dtype and pandas' value hashes.
# Patch-level parser/hash changes therefore affect committed oracle fingerprints.
dependencies = ["pandas==3.0.6", "numpy==2.4.6"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
data = ["ucimlrepo==0.0.7"]
inference = [
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "accelerate>=1.2,<2",
  "safetensors>=0.4",
  "jinja2>=3.1",
]
tokenizer = ["transformers==4.57.6", "jinja2>=3.1"]
training = [
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "accelerate>=1.2,<2",
  "safetensors>=0.4",
  "peft>=0.15,<1",
  "jinja2>=3.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
